name: CI

'on':
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      BUILD_PROFILE: debug
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Setup Rust
        uses: leynos/shared-actions/.github/actions/setup-rust@7d751eded578e48dacf43ab173d5820e6437c474
      - name: Install mdtablefix
        # `make check-fmt` runs `mdtablefix --check --git`; 0.6.0 is the
        # first release with `--check` and `--git`.
        uses: leynos/shared-actions/.github/actions/install-mdtablefix@ff1dd759dfffc0db3459e30e833f52437ee62b57
        with:
          version: "0.6.0"
      - name: Setup uv
        uses: astral-sh/setup-uv@bcf05803b55ef01a5ec6368521ee1b42f97bc438
      - name: Check the CV-005 contracts
        run: make test-workflow-contracts
      - name: Format
        run: make check-fmt
      - name: Markdown lint
        # The action reads .markdownlint-cli2.jsonc from the workspace, so
        # the rules and ignores (target, dist) match `make markdownlint`.
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff  # v24.2.0
        with:
          globs: '**/*.md'
      - name: Lint
        run: make lint
      - name: Test and Measure Coverage
        uses: leynos/shared-actions/.github/actions/generate-coverage@4fb8eb7ad52454678a0662865d81d3cd17aa6e0e
        with:
          use-cargo-nextest: "true"
          output-path: lcov.info
          format: lcov
          with-ratchet: "true"
          # Pull requests ratchet against the baseline coverage-main.yml
          # writes on main and never contact CodeScene; that workflow is the
          # one publisher. `make test-workflow-contracts` holds the shape.
          publish-artefact: "false"
