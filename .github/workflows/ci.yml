name: CI

'on':
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      BUILD_PROFILE: debug
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          # `cargo install cargo-orthohelp` compiles third-party crates and runs
          # their build scripts. Nothing in this job pushes, so keep the git
          # token out of `.git/config` while that code executes.
          persist-credentials: false
      - name: Setup Rust
        uses: leynos/shared-actions/.github/actions/setup-rust@0eabb6bc07148981de5da395e30cd78d83f5c7c2
        with:
          install-mold: 'true'
      - name: Install the supported MSRV toolchain
        # Keep this minor channel current rather than caching stale patches.
        run: rustup toolchain install 1.89 --profile minimal
      - name: Cache cargo-orthohelp binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-orthohelp
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-orthohelp-0.10.0-${{ hashFiles('rust-toolchain.toml') }}
      - name: Install cargo-orthohelp
        run: |
          if ! command -v cargo-orthohelp >/dev/null 2>&1; then
            cargo install cargo-orthohelp --version 0.10.0 --locked
          fi
      - name: Install mdtablefix
        # `make check-fmt` runs `mdtablefix --check --git`; 0.6.0 is the
        # first release with `--check` and `--git`.
        uses: leynos/shared-actions/.github/actions/install-mdtablefix@0eabb6bc07148981de5da395e30cd78d83f5c7c2
        with:
          version: "0.6.1"
      - name: Setup uv
        uses: astral-sh/setup-uv@963ce8fe9e4fb39553bd07a010f5e986c4dcff9d
      - name: Check the CV-005 contracts
        run: make test-workflow-contracts
      - name: Format
        run: make check-fmt
      - name: Check ADR/RFC names and links
        run: make check-adr-rfc-names
      - name: Markdown lint
        # The action reads .markdownlint-cli2.jsonc from the workspace, so
        # the rules and ignores (target, dist) match `make markdownlint`.
        uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34  # v25.0.0
        with:
          globs: '**/*.md'
      - name: Spelling
        run: make spelling
      - name: Install Whitaker
        uses: leynos/shared-actions/.github/actions/install-whitaker@0eabb6bc07148981de5da395e30cd78d83f5c7c2
      - name: Lint
        run: make lint
      - name: Typecheck
        run: make typecheck
      - name: Check minimum Rust version
        run: make msrv
      - name: Check agent-native command policy
        run: make check-agent-native
      - name: Fetch dependencies
        # Tests start their own cargo offline; fetch once so none resolves cold.
        run: cargo fetch --locked
      - name: Test and Measure Coverage
        env:
          # One of the two exclusions from the build standard: a coverage build is a
          # measurement, so it takes neither the parallel frontend nor the mold linker.
          # Assigning RUSTFLAGS displaces every `rustflags` table in .cargo/config.toml.
          RUSTFLAGS: -D warnings
        uses: leynos/shared-actions/.github/actions/generate-coverage@0eabb6bc07148981de5da395e30cd78d83f5c7c2
        with:
          use-cargo-nextest: "true"
          output-path: lcov.info
          format: lcov
          with-ratchet: "true"
          # Pull requests ratchet against the baseline coverage-main.yml
          # writes on main and never contact CodeScene; that workflow is the
          # one publisher. `make test-workflow-contracts` holds the shape.
          publish-artefact: "false"
      - name: Test
        # Coverage installs cargo-nextest, which this target requires.
        run: make test
