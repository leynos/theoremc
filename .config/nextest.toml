# cargo-nextest configuration for theoremc.
#
# Scope: every `cargo nextest` invocation, including `make test` and the
# coverage lane. nextest does not run doctests, which `make test` runs
# separately with `cargo test --doc`.
#
# Policy: no blanket retries. A test that fails intermittently is a defect to
# diagnose, not to paper over with re-runs.

[profile.default]
# Surface hangs without failing legitimately slow suites. Warn after 60 s and
# terminate a test that has run for five warning periods (300 s). This governs
# every test no override matches; none of them starts a compiler.
slow-timeout = { period = "60s", terminate-after = 5 }
# The whole run. Each test is bounded by its own allowance, but a run whose
# tests each stay inside theirs can still exceed the job. This stays strictly
# above the largest per-test allowance (600 s, below).
#
# Raised from 30 m on 17 November 2026, on measurement. The earlier 420 s
# figure described 818 tests; the suite now has 1021, and the compiler-spawning
# tests run one at a time (below), so the run's length is the sum of their
# allowances plus everything else. Three consecutive contended runs reached
# 1800 s with no assertion failure and work still outstanding: one had a test
# cancelled after 43 s of its own 600 s allowance, and two had seven tests
# (including the trybuild suite) never started. Each test remains bounded by
# its own allowance, so a hang is still terminated and named; this cap only
# decides how long the whole run may take.
global-timeout = "45m"

[test-groups.nested-cargo-builds]
# These tests start a child `cargo` or `rustc` of their own: temporary fixture
# crates that depend on the build-support crate, trybuild fixtures, a
# compile-fail unit test that runs rustc directly, and the end-to-end lint test
# that builds a throwaway workspace. Each pays for Cargo's package-cache lock
# and for compiler work inside its own allowance, so run beside each other they
# block on the same locks and a cold build looks like a hang. One at a time,
# each is bounded by its own work.
max-threads = 1

[[profile.default.overrides]]
# Every test that does compiler work inside its body: the fixture-crate suites,
# the macros crate's trybuild suite, the rustc compile-fail unit test, the
# two-package workspace the lint stages are proved against, and the lint-policy
# contract, which runs `cargo metadata` over the real workspace.
# Measured on a cold, contended local run (31 October): fixture suites took up
# to 290 s and the trybuild suite 417 s, both against the 300 s default, so the
# group gets ten warning periods (600 s). That is twice the default and the
# largest allowance in this file.
filter = 'binary(=build_discovery_bdd) | binary(=build_suite_bdd) | binary(=theorem_file_macro_bdd) | binary(=lint_workspace_execution) | binary(=lint_policy_contract) | binary_id(=theoremc-macros::expand) | (package(=theoremc) & test(/^arg_lowering::compile_fail_tests::/))'
test-group = "nested-cargo-builds"
slow-timeout = { period = "60s", terminate-after = 10 }
