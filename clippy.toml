# Cognitive complexity is not gated by Clippy: it scores code after macro
# expansion, so it counts branching a macro generated. Whitaker's
# `macro_aware_cognitive_complexity` gates it at 9 (see `dylint.toml`).
too-many-arguments-threshold = 4       # default is 7
too-many-lines-threshold = 70          # default is 100
excessive-nesting-threshold = 4        # default is off

allow-expect-in-tests = true

# Enforce the environment-injection mandate: production code reads the
# environment through an injected reader, and tests use a stub environment
# rather than mutating process state. The reason strings surface in the
# diagnostic, so a contributor who trips one is told what to do instead.
#
# Sanctioned boundary reads carry
# `#[expect(clippy::disallowed_methods, reason = "...")]` rather than `allow`,
# so the expectation becomes unfulfilled, and warns, once the site is migrated.
# The backlog removes itself instead of rotting.
#
# Intentional divergences from the Netsuke baseline:
# - `shell_quote::QuoteRefExt::quoted` is omitted, because TheoremC has no
#   `shell_quote` dependency; backend commands are lowered as argument vectors.
# - `std::io::IsTerminal::is_terminal` is omitted, because TheoremC performs no
#   terminal detection and writes machine-readable output.
disallowed-methods = [
  { path = "std::env::var", reason = "inject an environment reader" },
  { path = "std::env::var_os", reason = "inject an environment reader" },
  { path = "std::env::vars", reason = "inject an environment reader" },
  { path = "std::env::vars_os", reason = "inject an environment reader" },
  { path = "std::env::set_var", reason = "use a stub environment in tests" },
  { path = "std::env::remove_var", reason = "use a stub environment in tests" },
  { path = "std::env::set_current_dir", reason = "inject a base-directory seam; confine CWD changes to Command::current_dir" },
]
